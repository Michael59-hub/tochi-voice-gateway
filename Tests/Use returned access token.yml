runtime:
  scripts:
    - type: before-request
      code: |-
        // Pre Request script
        let currentKey = bru.getVar("idempotency_key");

        if (!currentKey) {
          const crypto = require("crypto");
          currentKey = crypto.randomUUID();
          bru.setVar("idempotency_key", currentKey);
        }

        console.log("Idempotency Key:", currentKey);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
