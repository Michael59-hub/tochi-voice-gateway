  method: POST
  url: http://localhost:3000/v1/voice/transcribe
  headers:
    - name: Idempotency-Key
      value: "{{idempoten"
  body:
    type: multipart-form
    data:
      - name: meta
        type: text
        value: '{"schemaVersion":1,"capturedAtEpochMs":1234567890000,"timezone":"Africa/Lagos","languageHint":"en","parse":true, "audio":{"durationSeconds":5}}'
        contentType: Text
      - name: audio
        type: file
        value:
          - planSpecificTitle.wav
        contentType: File
  auth:
    type: bearer
    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpbnN0YWxsYXRpb25JZCI6IjBjZjIwNjM5LTk0ZDctNDU1NC1hOGM2LWIyMTdiOWFlNTBhYSIsInRpZXIiOiJVTlZFUklGSUVEIiwiaWF0IjoxNzg5NDA1NjIyLCJleHAiOjE3ODk0MDkyMjJ9.buE-O4RkLtHWAqVfJ0xgIqr6CR86AsBXbnGhcPJ_yjU

runtime:
  scripts:
    - type: before-request
      code: |-
        // Pre Request script
        let currentKey = bru.getVar("idempotency_key");

        if (!currentKey) {
          const crypto = require("crypto");
          currentKey = crypto.randomUUID();
          bru.setVar("idempotency_key", currentKey);
        }

        console.log("Idempotency Key:", currentKey);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
