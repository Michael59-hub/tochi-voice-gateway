info:
  name: Status
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/v1/voice/requests/{{idempotency_key}}/status
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  variables:
    - name: idempotency_key
      value: "{{idempotency_key}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
