info:
  name: Access Token Refresh
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/v1/installations/refresh
  body:
    type: json
    data: |-
      {
        "refreshCredential": "{{refreshCredential}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        const data = typeof body === 'string' ? JSON.parse(body) : body;
        if (res.getStatus() === 200 && data?.accessToken && data?.refreshCredential) {
          bru.setEnvVar('accessToken', data.accessToken);
          bru.setEnvVar('refreshCredential', data.refreshCredential);
          bru.setVar('accessToken', data.accessToken);
          bru.setVar('refreshCredential', data.refreshCredential);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
